version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Astro, Starlight and their integrations move together.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "astro-*"
          - "starlight-*"
      tooling:
        patterns:
          - "wrangler"
          - "sharp"
      # A new Playwright also changes the image of the browser job and may change the screenshots.
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/playwright"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
