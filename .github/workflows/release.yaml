name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z), already in CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install PHP Twig
        run: composer install --working-dir tooling/twig-parity --no-interaction --no-progress
      - run: pnpm test:parity
      - name: Build and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tooling/release.mjs "$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes "See [CHANGELOG.md](https://github.com/stevenCayla/synapse-design-system/blob/main/CHANGELOG.md)." $flags

  # A final version updates design.synapse-medical.fr. A prerelease does not.
  deploy:
    needs: release
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://design.synapse-medical.fr
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate:docs
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: sh apps/docs/scripts/deploy.sh prod
